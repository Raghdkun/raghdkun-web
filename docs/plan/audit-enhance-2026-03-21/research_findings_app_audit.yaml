plan_id: audit-enhance-2026-03-21
objective: Comprehensive audit of the Next.js app's layout, page structure, components, styling, and potential issues.
focus_area: Layout structure, component architecture, CSS/styling, accessibility, performance patterns
created_at: "2026-03-21"
created_by: researcher
status: completed

tldr: |
  - Monolithic ~1400-line page.tsx handles all sections (hero, about, skills, projects, interlude, contact, footer) in a single "use client" component with heavy GSAP animation logic
  - Chrome audit report reveals duplicate React key errors across all viewports, overflow nodes from cursor/marquee elements, and an LCP warning on interlude-bg.webp
  - Three unused dependencies in package.json: @react-three/fiber, @react-three/drei, three — none are imported anywhere in the app
  - Accessibility is minimal: no skip-nav link, no focus-visible styling, SVG icons lack accessible labels, nav links use anchor href fragments without proper a11y roles
  - Film grain overlay on body::before at z-index:9999 covers the entire page — may interfere with browser accessibility tools and screen readers

research_metadata:
  methodology: "Hybrid retrieval: semantic_search + grep_search for pattern discovery, read_file for detailed examination across all app files, chrome audit report analysis"
  scope: "Full app directory (layout.tsx, page.tsx, globals.css, all 3 components, all config files), public assets inventory, existing chrome audit report, static website.html reference"
  confidence: high
  coverage: 100

