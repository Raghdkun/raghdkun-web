open_questions:
  - question: "Is the hero-bg.png intentionally kept alongside hero-bg.webp, or is it a leftover?"
    context: "public/images/ has both hero-bg.png and hero-bg.webp, but page.tsx references hero-bg.png. The .webp version may be unused or the .png should be replaced."
  - question: "Why are @react-three/fiber, @react-three/drei, and three in dependencies?"
    context: "No imports found for these packages anywhere in the app. They add ~2MB+ to node_modules. Possibly planned for future 3D features or leftover from experimentation."
  - question: "Is the interlude section intentionally missing the loading='eager' prop on its Image?"
    context: "Chrome audit flagged interlude-bg.webp as LCP element but it lacks priority or loading='eager'. On mobile, it may be below fold so this could be intentional."
  - question: "Should the website.html file be kept in the repo?"
    context: "It appears to be the original static prototype. The entire design has been ported to Next.js. May be useful as reference or may be dead weight."

gaps:
  - area: "No viewport meta tag override"
    description: "layout.tsx doesn't export a viewport config. Next.js uses default viewport, but explicit viewport export with themeColor would be better."
    impact: "Missing theme-color meta tag for mobile browser chrome theming."
  - area: "No structured data / JSON-LD"
    description: "No schema.org markup for Person, WebSite, or Portfolio. Would help with SEO."
    impact: "Reduced rich snippet potential in search results."
  - area: "No analytics or error monitoring"
    description: "No Sentry, LogRocket, Google Analytics, or similar services integrated."
    impact: "No visibility into production errors or user behavior."
  - area: "Incomplete OG metadata"
    description: "No og:image specified in metadata. Twitter card set to 'summary' not 'summary_large_image'."
    impact: "Social sharing will show no preview image."
  - area: "No web font fallback metrics"
    description: "Google Fonts with display:swap are good, but no adjustFontFallback or font-size-adjust for CLS reduction."
    impact: "Potential layout shift during font loading."
