patterns_found:
  - category: architecture
    pattern: "Monolithic client component"
    description: "The entire page (~1400 lines) is a single 'use client' component. All sections, animations, event listeners, and state management live in one file. This prevents any server-side rendering benefits for static content."
    examples:
      - file: app/page.tsx
        location: "app/page.tsx:1"
        snippet: '"use client";'
    prevalence: common

  - category: architecture
    pattern: "GSAP + CSS reveal double-animation"
    description: "CSS classes (.reveal, .reveal-left, etc.) define transition-based animations, but GSAP ScrollTrigger also animates the same elements via fromTo(). The GSAP scrub-based approach overrides CSS transitions, making the CSS animation definitions dead code."
    examples:
      - file: app/globals.css
        location: "app/globals.css:86-132"
        snippet: ".reveal { opacity: 0; transform: translateY(60px); transition: opacity 0.9s ... }"
      - file: app/page.tsx
        location: "app/page.tsx:354-370"
        snippet: 'gsap.utils.toArray<HTMLElement>(".reveal").forEach((el) => { gsap.fromTo(el, { opacity: 0, y: 60 }, ...) })'
    prevalence: common

  - category: error_handling
    pattern: "Error message exposure"
    description: "ErrorBoundary displays this.state.error?.message directly in the UI, which could expose stack traces or sensitive info in production."
    examples:
      - file: app/components/ErrorBoundary.tsx
        location: "app/components/ErrorBoundary.tsx:110"
        snippet: '{this.state.error?.message || "Unknown error"}'
    prevalence: occasional

  - category: naming
    pattern: "Cinematic/film noir naming convention"
    description: "Consistent theming throughout — 'ACT I', 'REEL', 'CUT!', 'SCENE', film-divider, scratch-line, vignette, etc."
    examples:
      - file: app/page.tsx
        location: "app/page.tsx:921"
        snippet: 'ACT I — ABOUT'
    prevalence: common

  - category: structure
    pattern: "Inline styles mixed with Tailwind"
    description: "Heavy use of inline style={} objects alongside Tailwind classes. Many styles (backgrounds, filters, fontSize clamp values) are inline rather than in CSS or Tailwind."
    examples:
      - file: app/page.tsx
        location: "app/page.tsx:795"
        snippet: "style={{ background: 'rgba(10,10,10,0.85)', backdropFilter: 'blur(10px)' }}"
    prevalence: common

  - category: error_handling
    pattern: "Graceful API fallback"
    description: "GitHub API fetch has AbortController cleanup and falls back to hardcoded repos on failure."
    examples:
      - file: app/page.tsx
        location: "app/page.tsx:122-138"
        snippet: ".catch(() => { setRepos(fallbackRepos); setLoaded(true); })"
    prevalence: occasional

  - category: accessibility
    pattern: "Reduced motion respect"
    description: "All three components (LoadingScreen, SmoothScroller, page.tsx) check prefers-reduced-motion and skip animations."
    examples:
      - file: app/components/LoadingScreen.tsx
        location: "app/components/LoadingScreen.tsx:96"
        snippet: 'if (prefersReducedMotion) { onComplete(); return; }'
      - file: app/components/SmoothScroller.tsx
        location: "app/components/SmoothScroller.tsx:16"
        snippet: 'if (prefersReducedMotion || isTouchDevice) { return; }'
    prevalence: common

  - category: testing
    pattern: "Puppeteer visual regression"
    description: "Custom chrome-audit.mjs script captures screenshots at 3 viewports, checks for overflow, section presence, and console errors."
    examples:
      - file: scripts/chrome-audit.mjs
        location: "scripts/chrome-audit.mjs:1-170"
        snippet: "Puppeteer launch with mobile/tablet/desktop viewports, overflow detection, section metrics"
    prevalence: rare

