tldr: |
  - GitHub username is **Raghdkun** (used in GITHUB_URL constant and multiple href links throughout page.tsx)
  - The mobile nav close button (X) is implemented as a CSS-only hamburger-to-X transform on 3 <span> elements. The **critical display issue** is that the hamburger spans are only 1px tall and use transform-origin: left, causing the X cross to appear off-center and nearly invisible due to insufficient visual weight.
  - Stats section has 4 hardcoded counters: "3+" years, "15+" projects, "3+" platforms, "100%" committed — all using GSAP counter animation with data-target attributes.
  - The "3+ YEARS EXP" badge is a separate element from the counter grid; replacing values with live GitHub data requires changing both the badge and the counter grid.

