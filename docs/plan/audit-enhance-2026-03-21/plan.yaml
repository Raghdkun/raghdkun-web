plan_id: audit-enhance-2026-03-21
objective: |
  Fix layout issues, improve styling, accessibility, performance, and component quality
  for the raghdkun Next.js portfolio app based on comprehensive audit findings.
  Focus on high-impact in-place fixes within the existing "use client" architecture —
  no server component migration, no code splitting, no infrastructure changes.
created_at: "2026-03-21"
created_by: gem-planner
status: pending_approval
research_confidence: high

tldr: |
  8-task plan across 4 waves to harden a monolithic Next.js 16 portfolio app.
  Wave 1 fixes foundational metadata, dead CSS, and config issues (3 parallel tasks).
  Wave 2 patches page.tsx bugs, adds accessibility, and secures ErrorBoundary (3 parallel tasks).
  Wave 3 modernizes GSAP usage with the useGSAP hook for cleaner lifecycle management.
  Wave 4 validates all changes via browser testing.
  All work stays within the existing "use client" architecture — no SSR migration.

open_questions:
  - Should an actual og:image be created/designed, or just wire up a placeholder path for now?
  - Is the film grain overlay (body::before z-index:9999) desired UX, or should it be removed entirely vs just lowered?
  - Are the three @react-three/* packages planned for future use, or safe to remove permanently?

pre_mortem:
  overall_risk_level: medium
  critical_failure_modes:
    - scenario: GSAP useEffect-to-useGSAP migration breaks ScrollTrigger animations
      likelihood: medium
      impact: high
      mitigation: |
        Task 7 is isolated in Wave 3. If animations break, revert useGSAP changes
        and keep raw useEffect. Browser testing in Wave 4 will catch regressions.
    - scenario: CSS cleanup removes styles still referenced by GSAP or JS classes
      likelihood: low
      impact: medium
      mitigation: |
        grep all class names being removed against page.tsx and globals.css before deletion.
        Task 2 agent must verify no JS code adds these classes dynamically.
    - scenario: Removing unused deps breaks pnpm lockfile or causes type errors
      likelihood: low
      impact: low
      mitigation: |
        Run pnpm install and pnpm build after removing deps to validate.
        Also remove @types/three from devDependencies.
    - scenario: Changing film grain z-index causes visual layering issues with mobile menu or loading screen
      likelihood: medium
      impact: medium
      mitigation: |
        Audit all z-index values in globals.css and components before changing.
        Mobile menu and loading screen z-indexes must remain above film grain.
  assumptions:
    - The app builds successfully with pnpm build before any changes
    - hero-bg.webp is a valid replacement for hero-bg.png (same dimensions, correct content)
    - The @gsap/react package's useGSAP hook is compatible with GSAP 3.14+ and React 19
    - No other consumers of @react-three/* exist outside the scanned codebase

implementation_specification:
  code_structure: |
    All changes are in-place edits to existing files. No new components or modules are created.
    The monolithic page.tsx architecture is preserved — fixes are surgical patches, not refactors.
  affected_areas:
    - app/layout.tsx (metadata + viewport export)
    - app/globals.css (dead code removal, z-index fix, delay class removal, @theme cleanup)
    - next.config.ts (remote image patterns)
    - package.json (unused dependency removal)
    - app/page.tsx (bug fixes, image path, memoization, cursor fix, will-change cleanup)
    - app/components/ErrorBoundary.tsx (production error message sanitization)
  component_details:
    - component: layout.tsx metadata
      responsibility: Provide complete SEO metadata including viewport, og:image, twitter large card, themeColor
      interfaces:
        - "export const metadata: Metadata"
        - "export const viewport: Viewport"
    - component: globals.css
      responsibility: Provide global styles without dead code, correct z-index layering, no Tailwind conflicts
      interfaces:
        - "body::before film grain at z-index:50 (below modals/menus)"
    - component: next.config.ts
      responsibility: Configure Next.js image optimization with GitHub avatar remote patterns
      interfaces:
        - "images.remotePatterns for avatars.githubusercontent.com"
    - component: page.tsx patches
      responsibility: Fix runtime bugs (duplicate keys, cursor position, image format, memoization)
      interfaces:
        - "Unique React keys for fallbackRepos"
        - "Cursor initialized off-screen until first mousemove"
    - component: ErrorBoundary.tsx
      responsibility: Catch errors without leaking implementation details in production
      interfaces:
        - "Generic error message in production, detailed in development"
    - component: Accessibility layer
      responsibility: Add skip-nav, focus-visible, aria-labels for screen reader compliance
      interfaces:
        - "Skip-to-content link in layout.tsx"
        - "Focus-visible utility in globals.css"
  dependencies:
    - component: Wave 2 tasks
      relationship: Depend on Wave 1 completing CSS and config cleanup to avoid merge conflicts
    - component: Task 7 (useGSAP)
      relationship: Depends on Task 4 page.tsx bug fixes being applied first
    - component: Task 8 (browser testing)
      relationship: Validates all previous waves — depends on all implementation tasks
  integration_points:
    - layout.tsx viewport export integrates with Next.js metadata API
    - next.config.ts remotePatterns integrates with next/image component in page.tsx
    - Skip-nav link in layout.tsx targets #main-content anchor in page.tsx
    - ErrorBoundary production check uses process.env.NODE_ENV

contracts:
  - from_task: task-1
    to_task: task-5
    interface: layout.tsx has a skip-nav link target structure that task-5 wires up
    format: "Skip-nav link in layout.tsx body, #main-content id on main element in page.tsx"
  - from_task: task-2
    to_task: task-4
    interface: globals.css dead code is removed so page.tsx fixes don't reference stale classes
    format: "No .reveal/.delay-* classes remain in globals.css after task-2"
  - from_task: task-4
    to_task: task-7
    interface: page.tsx bug fixes are in place before useGSAP migration modifies the same useEffect blocks
    format: "page.tsx with clean fallbackRepos keys, hero-bg.webp, cursor fix applied"

