          Next.js inlines NODE_ENV at build time for client components.
          This is a well-established pattern.

  - id: task-7
    title: Migrate GSAP animations to useGSAP hook
    description: |
      Replace raw useEffect + gsap.context() pattern with the useGSAP hook from @gsap/react.
      The package is already installed but the hook is never used.

      The main animation useEffect in page.tsx (lines ~241-620) creates a gsap.context()
      and returns context.revert() in cleanup. The useGSAP hook handles this automatically
      with better cleanup semantics.

      Steps:
      1. Import { useGSAP } from "@gsap/react" at top of page.tsx
      2. Replace the main GSAP useEffect (lines ~241-620) with useGSAP(() => { ... }, { scope: containerRef })
         where containerRef is a ref on the outermost wrapper element.
      3. The useGSAP hook auto-reverts all GSAP animations on unmount — remove manual
         context.revert() cleanup.
      4. Keep the dependency array behavior equivalent (should run once on mount).

      IMPORTANT: This is a 1:1 migration — do NOT change any animation logic, timing,
      or ScrollTrigger configuration. Only change the hook wrapper.

      If the migration is complex or risky due to multiple useEffects with GSAP,
      limit scope to the single largest useEffect only.
    wave: 3
    agent: gem-implementer
    priority: medium
    status: pending
    dependencies:
      - task-4
    context_files:
      - app/page.tsx: "Lines ~241-620 (main GSAP useEffect), line 1 (imports)"
      - node_modules/@gsap/react/: "useGSAP hook API reference"
    estimated_effort: medium
    estimated_files: 1
    estimated_lines: 30
    focus_area: app/page.tsx
    tech_stack:
      - "@gsap/react useGSAP hook"
      - GSAP 3.14+
      - React 19
    test_coverage: null
    verification:
      - "pnpm build completes without errors"
      - "All scroll-triggered animations still fire correctly"
      - "No GSAP warnings or errors in browser console"
      - "Animations clean up properly on page navigation"
    acceptance_criteria:
      - Main GSAP useEffect replaced with useGSAP hook
      - Manual gsap.context() and context.revert() removed
      - All animations behave identically to before
      - No console errors or warnings
    failure_modes:
      - scenario: useGSAP scope doesn't capture all ScrollTrigger targets
        likelihood: medium
        impact: high
        mitigation: |
          If any animations break, verify the scope ref wraps all animated elements.
          Fallback: revert to useEffect pattern completely — this is a polish task, not critical.
    requires_review: true
    review_depth: standard
    security_sensitive: false

  - id: task-8
    title: Browser validation of all changes
    description: |
      Comprehensive browser testing to validate all changes from Waves 1-3.

      Test the following scenarios:
      1. PAGE LOAD: Loading screen appears, page renders without console errors
      2. METADATA: Verify page source has correct viewport meta, og:image, twitter card
      3. SCROLL ANIMATIONS: All GSAP scroll-triggered animations fire correctly
         (hero parallax, section reveals, skill cards, project cards, interlude)
      4. MOBILE MENU: Hamburger toggle opens/closes menu, links navigate correctly
      5. CUSTOM CURSOR: Not visible at (0,0) on load, follows mouse after first move
      6. PROJECTS SECTION: No duplicate key warnings in console (check fallbackRepos)
      7. HERO IMAGE: Verify hero background uses .webp format
      8. ACCESSIBILITY: Tab through page — skip-nav visible on focus, focus outlines present
      9. FILM GRAIN: Overlay visible but doesn't block interactions or mobile menu
      10. ERROR BOUNDARY: Artificially trigger error to verify generic message in prod build
      11. RESPONSIVE: Test at mobile (375px), tablet (768px), desktop (1440px) viewports
    wave: 4
    agent: gem-browser-tester
    priority: high
    status: pending
    dependencies:
      - task-4
      - task-5
      - task-6
      - task-7
    context_files:
