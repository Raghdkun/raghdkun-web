  - id: task-4
    title: Fix page.tsx bugs (keys, cursor, image, memoization)
    description: |
      Fix multiple runtime bugs in app/page.tsx:

      1. DUPLICATE REACT KEYS: fallbackRepos array (line ~42-47) uses repo.html_url as key
         but all entries share "https://github.com/Raghdkun". Fix by giving each fallback repo
         a unique html_url (e.g., append /<repo-name>) or use the repo name as the key
         in the map() call at line ~1141.

      2. HERO IMAGE FORMAT: Change src="/images/hero-bg.png" to src="/images/hero-bg.webp"
         at line ~801 to use the optimized WebP version that already exists in public/images/.

      3. CURSOR INITIAL POSITION: The custom cursor div renders at (0,0) on page load,
         causing potential overflow. Initialize cursor position off-screen (e.g., transform:
         translate(-100px, -100px)) or set opacity:0 until first mousemove event.

      4. MARQUEE ARRAY: marqueeItems array (line ~79) is defined at module scope — fine.
         But verify it's not being recreated inside the component. If it's inside, move it outside.

      5. WILL-CHANGE CLEANUP: Elements with will-change-transform class (hero bg, hero content,
         hero letters, interlude bg) never remove the property. Add will-change: auto after
         animations complete in the GSAP onComplete callbacks, or accept the current state
         if animations persist during scroll.

      SCOPE: Only fix the specific bugs listed above. Do NOT refactor the component structure.
    wave: 2
    agent: gem-implementer
    priority: high
    status: pending
    dependencies:
      - task-2
    context_files:
      - app/page.tsx: "Lines 42-47 (fallbackRepos), ~79 (marqueeItems), ~89 (cursorRef), ~129-178 (cursor logic), ~797-801 (hero bg image), ~1141 (repo map key), ~1233 (interlude bg)"
      - public/images/: "hero-bg.webp exists alongside hero-bg.png"
    estimated_effort: medium
    estimated_files: 1
    estimated_lines: 40
    focus_area: app/page.tsx
    tech_stack:
