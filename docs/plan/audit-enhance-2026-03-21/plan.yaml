          - Move mouse to trigger cursor
        expected_result: Cursor hidden until first mousemove, then follows mouse smoothly
      - scenario: Mobile responsive
        steps:
          - Resize to 375px width
          - Open mobile menu
          - Navigate sections
          - Verify film grain doesn't block interactions
        expected_result: Menu opens/closes, links work, no z-index blocking
      - scenario: Error boundary production message
        steps:
          - Build with pnpm build, start with pnpm start
          - Trigger error (temporarily throw in a component)
          - Check error message displayed
        expected_result: Generic error message shown, not raw error.message
    requires_review: false
    review_depth: null
    security_sensitive: false
    environment: development
    requires_approval: false
