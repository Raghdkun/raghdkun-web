  - id: task-2
    title: Clean up dead CSS and fix styling issues in globals.css
    description: |
      1. Remove dead reveal animation classes (.reveal, .reveal-left, .reveal-right, .reveal-scale
         and their .visible variants) — GSAP controls these animations entirely via inline styles.
         Also remove the prefers-reduced-motion media query block that references these classes.
      2. Remove conflicting delay utility classes (.delay-1 through .delay-6) that clash with
         Tailwind's built-in delay utilities.
      3. Lower body::before film grain z-index from 9999 to 50 so it doesn't cover modals,
         mobile menu, or interfere with screen readers. Verify mobile-menu and loading screen
         z-indexes remain higher.
      4. Clean up @theme inline block — ensure font variable definitions are clear and
         non-circular (they should reference the next/font CSS variables like --font-playfair etc).

      IMPORTANT: Before removing any class, grep page.tsx to confirm it's not dynamically added by JS.
      The GSAP code in page.tsx adds "visible" class to elements but controls transforms via
      gsap.to() — the CSS transitions are never used.
    wave: 1
    agent: gem-implementer
    priority: high
    status: pending
    dependencies: []
    context_files:
      - app/globals.css: "Lines 3-7 (@theme), 51-63 (film grain), 86-142 (reveal + delay classes), ~454 (reduced-motion reveal block)"
      - app/page.tsx: "GSAP animations at lines 241-620 — verify class usage patterns"
    estimated_effort: medium
    estimated_files: 1
    estimated_lines: 80
    focus_area: app/globals.css
    tech_stack:
      - Tailwind CSS v4
      - CSS custom properties
    test_coverage: null
    verification:
      - "pnpm build completes without errors"
      - "No .reveal or .delay-N classes remain in globals.css"
      - "body::before z-index is 50, not 9999"
      - "grep confirms no page.tsx code references removed CSS class names for transitions"
    acceptance_criteria:
      - All .reveal*, .delay-* CSS rules are removed from globals.css
      - body::before z-index changed from 9999 to 50
      - @theme block has clear, non-circular font variable definitions
      - Mobile menu and loading screen z-indexes verified higher than 50
      - Build succeeds and no visual regression in film grain effect
    failure_modes:
      - scenario: Removing reveal classes breaks GSAP "visible" class toggle
        likelihood: low
        impact: medium
        mitigation: |
          GSAP adds "visible" class but drives transforms via gsap.to() — CSS transitions
          are redundant. Verify by checking if page.tsx classList.add("visible") is
          paired with CSS transition reliance. If so, keep only the class name, remove transition.
      - scenario: Film grain z-index change causes it to render behind content
        likelihood: low
        impact: low
        mitigation: "z-index:50 is above normal content (z-0 to z-10) but below modals (z-[9999])"

