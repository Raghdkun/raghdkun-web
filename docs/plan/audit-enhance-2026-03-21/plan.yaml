         Use :focus-visible pseudo-class.

      3. SVG ARIA LABELS: Add aria-hidden="true" to decorative SVGs in page.tsx (icons in
         skill cards, social links, etc.). For meaningful SVGs (like social media links),
         add aria-label to the parent <a> tag instead.

      4. CONTACT LINK ARIA: Add aria-label attributes to contact section links (email, phone,
         social media) that currently only have icon content.

      5. NAV ARIA: Add aria-label="Main navigation" to the <nav> element. Ensure mobile menu
         toggle has aria-expanded and aria-controls attributes.

      SCOPE: Add a11y attributes and skip-nav. Do NOT restructure components.
    wave: 2
