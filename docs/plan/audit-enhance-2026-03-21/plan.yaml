      - app/layout.tsx: "Metadata and skip-nav to validate"
      - app/globals.css: "CSS changes to validate visually"
      - app/components/ErrorBoundary.tsx: "Error display to validate"
    estimated_effort: medium
    estimated_files: 0
    estimated_lines: 0
    focus_area: null
    validation_matrix:
      - scenario: Page loads without console errors
        steps:
          - Open http://localhost:3000 in browser
          - Wait for loading screen to complete
          - Open browser console and check for errors
        expected_result: No React warnings, no duplicate key errors, no GSAP errors
      - scenario: Metadata is correct in page source
        steps:
          - View page source
          - Search for viewport, og:image, twitter:card meta tags
        expected_result: |
          viewport meta has themeColor, og:image present,
          twitter:card is "summary_large_image"
      - scenario: Scroll animations work correctly
        steps:
          - Scroll through entire page slowly
          - Observe hero parallax, section reveals, skill cards, project cards
        expected_result: All animations trigger on scroll, no jank or broken transforms
      - scenario: Skip-nav and keyboard navigation
        steps:
          - Press Tab from top of page
          - Verify skip-nav link appears
          - Press Enter on skip-nav
