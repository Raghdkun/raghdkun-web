  - id: task-6
    title: Secure ErrorBoundary error display for production
    description: |
      Modify ErrorBoundary.tsx to not expose raw error.message in production.

      Current code at line ~115 shows:
        {this.state.error?.message || "Unknown error"}

      Change to:
        - In development (process.env.NODE_ENV === "development"): show full error.message
        - In production: show a generic message like "An unexpected error occurred."

      This prevents leaking internal implementation details, stack traces, or
      sensitive data through error messages in production builds.
    wave: 2
    agent: gem-implementer
    priority: medium
    status: pending
    dependencies: []
    context_files:
